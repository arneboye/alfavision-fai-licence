name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: Pack (smoke test of the package build)
        run: dotnet pack src/AlfaVision.FaiLicence/AlfaVision.FaiLicence.csproj --no-build -c Release -o artifacts -p:Version=0.0.0-ci
