name: Publish to nuget.org

# Runs when a version tag is pushed: `git tag v1.2.3 && git push --tags`.
# Uses nuget.org Trusted Publishing (OIDC): no API key is stored anywhere. One-time setup on nuget.org is described
# in README.md under "Releasing".
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -p:Version=$VERSION
      - run: dotnet test --no-build -c Release
      - run: dotnet pack src/AlfaVision.FaiLicence/AlfaVision.FaiLicence.csproj --no-build -c Release -o artifacts -p:Version=$VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.*nupkg
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: arneboye
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
